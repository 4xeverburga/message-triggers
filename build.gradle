plugins {
	id 'fabric-loom' version '1.18.4'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// E2E driver mod: a second source set so it compiles with the project but is
// never packaged into the production jar (remapJar only uses sourceSets.main).
// The loom run below loads BOTH mods: the driver (this source set) and the
// mod under test (main's output is on the e2e runtime classpath).
sourceSets {
	e2e {
		java.srcDirs = ['src/e2e/java']
		resources.srcDirs = ['src/e2e/resources']
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

loom {
	runs {
		e2eClient {
			client()
			source = sourceSets.e2e
			// Keep the game dir inside e2e/ so run-e2e.sh's paths are stable.
			runDir 'e2e/run'
			// Fixed username (the harness asserts against it); the driver mod
			// itself initiates the join via ConnectScreen.connect, so no
			// quickplay args (they silently no-op in dev environments).
			programArgs '--username', 'E2ETester'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Client command API (/mtriggers in-game config). Ships inside fabric-api.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Pure-logic unit tests (ChatLineParser) — no Minecraft classes needed.
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Gson comes with Minecraft at runtime; declared here so the plain test
	// task (which does not put Minecraft on the classpath) can use it.
	testImplementation 'com.google.code.gson:gson:2.10.1'
	// BridgeConfig logs load warnings via slf4j; provide it (silent) for tests.
	testImplementation 'org.slf4j:slf4j-api:2.0.16'
	testRuntimeOnly 'org.slf4j:slf4j-nop:2.0.16'
}

test {
	useJUnitPlatform()
}

// Full-fidelity pre-launch verification lives in the e2e harness
// (e2e/run-e2e.sh): it spawns a real dev client with only this mod loaded,
// joins a local vanilla server, and drives the chat capture path end to end
// through the actual mixin injection point.

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
